const seed={customers:[{id:1,name:'Exempelkund AB',email:'kontakt@exempel.invalid',paymentDays:30},{id:2,name:'Demobolaget AB',email:'',paymentDays:30}],projects:[{id:1,customerId:1,name:'Teknisk konsultation'},{id:2,customerId:1,name:'Projektledning'},{id:3,customerId:2,name:'Utveckling'}],entries:[],articles:[{id:101,name:'Arbetstid',unit:'timmar',price:null,mode:'quantity'},{id:102,name:'Övertid',unit:'timmar',price:null,mode:'quantity'},{id:103,name:'Hotell',unit:'nätter',price:null},{id:104,name:'Taxi',unit:'resor',price:null},{id:105,name:'Flyg',unit:'resor',price:null},{id:106,name:'Övrigt',unit:'stycken',price:null}]};let data;try{data=JSON.parse(localStorage.getItem('dolevi-demo-v01'))||seed}catch{data=seed}if(!Array.isArray(data.invoices))data.invoices=[];if(!data.company)data.company={name:'Dolevi AB',country:'Sverige',approvedFtax:true};if(!Array.isArray(data.articles))data.articles=seed.articles.map(a=>({...a}));if(!data.invoiceSequence)data.invoiceSequence={legacyLast:''};if(!data.appConfig)data.appConfig={nextInvoiceNumber:'',language:'sv',vatRate:'25',invoiceTemplate:'classic-a4',jurisdiction:'SE'};for(const p of data.projects){if(p.hourlyPrice===undefined){const c=data.customers.find(c=>c.id===p.customerId);p.hourlyPrice=c?.hourlyPrice??null}};let configOpen=false;let customerDetailId=null,customerEditorMode=false,projectEditorMode=false;let current='customers',selectedCustomer=1;let lastEntryProjectId=null,lastEntryArticleId=null;let entryFormOpen=false;let selectedEntryProjectId=null;const $=id=>document.getElementById(id),save=()=>localStorage.setItem('dolevi-demo-v01',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('sv-SE',{style:'currency',currency:'SEK'}).format(n);function tab(t){customerDetailId=null;customerEditorMode=false;projectEditorMode=false;window.scrollTo(0,0);if(t!=='settings')configOpen=false;if(current==='entries'&&t!=='entries')entryFormOpen=false;current=t;['customers','entries','articles','reports','invoices','settings'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('title').textContent={customers:'Kunder',entries:'Registrering',articles:'Artiklar',reports:'Rapporter',invoices:'Fakturor',settings:'Företagsuppgifter'}[t];render()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function render(){if(current==='customers')customers();if(current==='entries')entries();if(current==='articles')articles();if(current==='reports')reports();if(current==='invoices')invoices();if(current==='settings')settings()}
let showArchivedCustomers=false;
function customerProjectOpen(id){const project=data.projects.find(p=>p.id===id);if(!project)return;selectedCustomer=project.customerId;selectedEntryProjectId=project.id;lastEntryProjectId=project.id;entryFormOpen=false;tab('entries')}
function openCustomerDetail(id){customerDetailId=id;customerEditorMode=false;projectEditorMode=false;customers();window.scrollTo(0,0)}
function customerFact(label,value){return `<div class="customer-fact"><span>${esc(label)}</span><span>${esc(value||'–')}</span></div>`}
function customers(){
 const root=$('customers');
 if(customerDetailId!==null){
  const c=data.customers.find(c=>c.id===customerDetailId);if(!c){customerDetailId=null;customers();return}
  root.innerHTML=`<div class="customer-detail-head"><button class="back" id="backCustomers">← Kunder</button><h2>${esc(c.name)}</h2><button class="btn secondary" id="editCustomerDetail" aria-label="Redigera kunduppgifter">✎</button></div><h3>Kunduppgifter</h3><div class="customer-facts">${customerFact('E-post',c.email)}${customerFact('Adress',[c.address,c.postalCode,c.city].filter(Boolean).join(', '))}${customerFact('Land',c.country)}${customerFact('Kontaktperson',c.contactPerson)}${customerFact('Telefon',c.phone)}${customerFact('Organisationsnummer',c.orgNumber)}${customerFact('Momsregistreringsnummer',c.vatNumber)}${customerFact('Betalningsvillkor',`${c.paymentDays??30} dagar`)}</div><div id="customerForm" class="customer-editor"></div><div class="row" style="margin-top:22px"><h2 style="margin:0">Uppdrag</h2><button class="btn" id="addProjectDetail">+ Nytt uppdrag</button></div>${data.projects.filter(p=>p.customerId===c.id&&(!p.archived||showArchivedCustomers)).map(p=>`<div class="customer-detail-project"><div class="row"><div><strong>${esc(p.name)}</strong><span class="muted">${p.reference?'Referens: '+esc(p.reference)+' · ':''}${p.hourlyPrice!=null&&p.hourlyPrice!==''?money(Number(p.hourlyPrice))+'/tim':'Artikelpris gäller'}${p.archived?' · Arkiverat':''}</span></div><button class="btn secondary" data-edit-project="${p.id}">Redigera</button></div></div>`).join('')||'<p class="muted">Inga uppdrag ännu.</p>'}<div id="projectForm" class="customer-editor"></div>`;
  $('backCustomers').onclick=()=>{customerDetailId=null;customers();window.scrollTo(0,0)};
  $('editCustomerDetail').onclick=()=>{customerEditorMode=true;customerForm(c.id)};
  $('addProjectDetail').onclick=()=>{projectEditorMode=true;projectForm(null,c.id)};
  root.querySelectorAll('[data-edit-project]').forEach(el=>el.onclick=()=>{projectEditorMode=true;projectForm(Number(el.dataset.editProject))});
  return;
 }
 root.innerHTML=`<div class="row"><h2>Kunder och uppdrag</h2><button class="btn" id="addCustomer">+ Ny kund</button></div>${data.customers.filter(c=>!c.archived||showArchivedCustomers).map(c=>`<div class="customer-card" ${c.archived?'style="opacity:.72"':''}><button class="customer-open" data-open-customer="${c.id}"><span><strong>${esc(c.name)}</strong><span class="muted">${data.projects.filter(p=>p.customerId===c.id&&!p.archived).length} aktiva uppdrag${c.archived?' · Arkiverad kund':''}</span></span><span class="customer-chevron" aria-hidden="true">›</span></button>${data.projects.filter(p=>p.customerId===c.id&&(!p.archived||showArchivedCustomers)).map(p=>`<div class="customer-project" role="button" tabindex="0" data-open-project="${p.id}" title="Öppna registrering för uppdraget"><div class="row"><div><strong>${esc(p.name)}</strong>${p.reference?`<span class="muted">Er referens: ${esc(p.reference)}</span>`:''}<span class="muted">${p.hourlyPrice!=null&&p.hourlyPrice!==''?'Timpris '+money(Number(p.hourlyPrice)):'Artikelpris gäller'}${p.archived?' · Arkiverat':''}</span></div><span class="customer-chevron" aria-hidden="true">›</span></div></div>`).join('')||'<div class="muted">Inga uppdrag ännu.</div>'}</div>`).join('')}<button class="btn secondary full" id="toggleArchived">${showArchivedCustomers?'Dölj arkiverade':'Visa arkiverade kunder och uppdrag'}</button><div id="customerForm" class="customer-editor"></div><div id="projectForm" class="customer-editor"></div>`;
 $('toggleArchived').onclick=()=>{showArchivedCustomers=!showArchivedCustomers;customers()};
 $('addCustomer').onclick=()=>{customerEditorMode=true;customerForm(null)};
 root.querySelectorAll('[data-open-customer]').forEach(el=>el.onclick=()=>openCustomerDetail(Number(el.dataset.openCustomer)));
 root.querySelectorAll('[data-open-project]').forEach(el=>{el.onclick=()=>customerProjectOpen(Number(el.dataset.openProject));el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}}});
}
function customerForm(id){const c=data.customers.find(c=>c.id===id);$('customerForm').innerHTML=`<h2>${c?'Redigera kund':'Ny kund'}</h2><form id="cf"><label>Kundnamn<input name="name" required maxlength="150" value="${esc(c?.name||'')}" placeholder="Företag AB"></label><label>E-post (valfritt)<input type="email" name="email" value="${esc(c?.email||'')}"></label><h3>Fakturaadress och kontakt</h3><label>Gatuadress / box<input name="address" value="${esc(c?.address||'')}" placeholder="Gata och nummer"></label><div class="row"><label style="flex:1">Postnummer<input name="postalCode" value="${esc(c?.postalCode||'')}" placeholder="123 45"></label><label style="flex:2">Postort<input name="city" value="${esc(c?.city||'')}"></label></div><label>Land<input name="country" value="${esc(c?.country||'Sverige')}"></label><label>Organisationsnummer (frivilligt)<input name="orgNumber" value="${esc(c?.orgNumber||'')}" placeholder="XXXXXX-XXXX"></label><label>Kontaktperson (frivilligt)<input name="contactPerson" value="${esc(c?.contactPerson||'')}"></label><label>Telefon (frivilligt)<input name="phone" type="tel" value="${esc(c?.phone||'')}"></label><label>Momsregistreringsnummer (frivilligt, framtida bruk)<input name="vatNumber" value="${esc(c?.vatNumber||'')}"></label><label>Betalningsvillkor (dagar)<input type="number" name="paymentDays" min="0" max="365" step="1" value="${c?.paymentDays??30}" required></label><p class="muted">Timpris sätts per uppdrag. Historiska registreringar behåller sina sparade priser.</p><div class="row"><button class="btn full">${c?'Spara ändringar':'Spara kund'}</button><button type="button" class="btn secondary" id="cancelCustomer">Avbryt</button>${c?`<button type="button" class="btn secondary" id="archiveCustomer">${c.archived?'Återaktivera kund':'Arkivera kund'}</button>`:''}</div></form>`;
 $('cancelCustomer').onclick=()=>{customerEditorMode=false;$('customerForm').innerHTML=''};if(c)$('archiveCustomer').onclick=()=>{if(!c.archived&&!confirm('Arkivera kunden och dess uppdrag? Historik och fakturor behålls.'))return;c.archived=!c.archived;data.projects.filter(p=>p.customerId===c.id).forEach(p=>p.archived=c.archived);save();customers()};
 $('cf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim(),paymentDays=Number(f.get('paymentDays'));if(!Number.isInteger(paymentDays)||paymentDays<0||paymentDays>365)return;if(!name)return; const extra={};['address','postalCode','city','country','orgNumber','contactPerson','phone','vatNumber'].forEach(k=>extra[k]=String(f.get(k)||'').trim());if(c){Object.assign(c,{name,email,paymentDays},extra)}else {const created={id:Date.now(),name,email,paymentDays,...extra};data.customers.push(created);customerDetailId=created.id}customerEditorMode=false;save();customers();window.scrollTo(0,0)};
}
function projectForm(id,customerId){const p=data.projects.find(p=>p.id===id);customerId=p?.customerId??customerId;const c=data.customers.find(c=>c.id===customerId);if(!c)return;
 $('projectForm').innerHTML=`<h2>${p?'Redigera uppdrag':'Nytt uppdrag'} – ${esc(c.name)}</h2><form id="pf"><label>Uppdragsnamn<input name="name" required maxlength="150" value="${esc(p?.name||'')}"></label><label>Er referens (frivilligt)<input name="reference" maxlength="200" value="${esc(p?.reference||'')}" placeholder="Kontaktperson, beställningsnummer eller annat"></label><label>Standardtimpris för uppdraget, kr exkl. moms (frivilligt)<input type="number" name="hourlyPrice" min="0" step="0.01" value="${p?.hourlyPrice??''}" placeholder="Tomt = artikelpris"></label><p class="muted">Gäller nya timregistreringar. Redan sparade registreringar påverkas inte.</p><div class="row"><button class="btn full">${p?'Spara ändringar':'Spara uppdrag'}</button><button type="button" class="btn secondary" id="cancelProject">Avbryt</button>${p?`<button type="button" class="btn secondary" id="archiveProject">${p.archived?'Återaktivera uppdrag':'Arkivera uppdrag'}</button>`:''}</div></form>`;
 $('cancelProject').onclick=()=>{projectEditorMode=false;$('projectForm').innerHTML=''};if(p)$('archiveProject').onclick=()=>{if(!p.archived&&!confirm('Arkivera uppdraget? Historik och fakturor behålls.'))return;p.archived=!p.archived;save();customers()};
 $('pf').onsubmit=e=>{e.preventDefault();const form=new FormData(e.target),name=String(form.get('name')||'').trim(),reference=String(form.get('reference')||'').trim(),rateRaw=String(form.get('hourlyPrice')||'').trim(),hourlyPrice=rateRaw===''?null:Number(rateRaw);if(!name||(hourlyPrice!==null&&(!Number.isFinite(hourlyPrice)||hourlyPrice<0)))return;if(p){p.name=name;p.reference=reference;p.hourlyPrice=hourlyPrice}else data.projects.push({id:Date.now(),customerId,name,reference,hourlyPrice});projectEditorMode=false;save();customers()};
 $('projectForm').scrollIntoView({block:'nearest',behavior:'smooth'});

  const url=URL.createObjectURL(pdf);const a=document.createElement('a');a.href=url;a.download=filename;a.textContent='Öppna PDF';a.style.display='block';a.style.margin='16px 0';a.style.padding='14px';a.style.background='#eef5ff';a.style.borderRadius='8px';a.target='_blank';const parent=document.querySelector('#issuedInvoiceDetails .card')||document.querySelector('#invoiceEditor #invoicePreview');parent?.prepend(a);a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);

function fitArchivedPreview(){
 const viewport=document.querySelector('.archive-preview-viewport'), content=viewport?.querySelector('.archive-preview-content');
 if(!viewport||!content)return;
 const sheet=content.querySelector('.invoice-sheet');if(!sheet)return;
 const width=794,available=Math.max(200,viewport.clientWidth-2),scale=Math.min(1,available/width);
 content.style.width=width+'px';content.style.transform='scale('+scale+')';content.style.transformOrigin='top left';
 viewport.style.height=Math.ceil(content.scrollHeight*scale+4)+'px';
}
window.addEventListener('resize',fitArchivedPreview);window.addEventListener('afterprint',()=>document.body.classList.remove('printing-archive'));
function printA4Invoice(){
 // Open a visible print page synchronously from the user's tap (Safari/iOS compatible).
 const printWindow=window.open('','_blank');
 if(!printWindow){alert('Utskriftsfönstret blockerades. Tillåt popupfönster och försök igen.');return}
 const root=document.querySelector('#invoicePreview .invoice-sheet');
 if(!root){printWindow.close();alert('Öppna fakturaförhandsgranskningen först.');return}
 const top=root.querySelector('.invoice-top')?.outerHTML||'';
 const meta=root.querySelector('.invoice-meta')?.outerHTML||'';
 const lines=[...root.querySelectorAll('.invoice-lines tbody tr')].map(r=>r.outerHTML);
 const head=root.querySelector('.invoice-lines thead')?.outerHTML||'';
 const totals=root.querySelector('.invoice-totals')?.outerHTML||'';
 const payment=root.querySelector('.invoice-payment')?.outerHTML||'';
 const note=[...root.children].find(e=>e.classList.contains('invoice-note'))?.outerHTML||'';
 const attachment=root.querySelector('.invoice-attachment');
 const comment=root.querySelector('.invoice-comment')?.outerHTML||'';
 // Fixed row capacity is deliberately conservative: the bottom payment block never moves.
 // Continuation pages have more room because the customer/address header is shorter.
 const chunks=[];let current=[],budget=0,first=true;
 for(const row of lines){
   const cost=row.includes('class="refrow"')?1.6:1;
   const limit=first?10:17;
   if(current.length&&budget+cost>limit){chunks.push(current);current=[];budget=0;first=false}
   current.push(row);budget+=cost;
 }
 chunks.push(current);
 const pages=chunks.map((rows,n)=>{
   const last=n===chunks.length-1;
   const header=n===0?`${top}${meta}${comment}`:`<div class="continuation"><strong>FAKTURA – fortsättning</strong><span>${esc(root.querySelector('.invoice-meta strong')?.textContent||'')} · Sida ${n+1}</span></div>`;
   return `<section class="paper"><div class="page-head">${header}</div><div class="page-lines"><table class="invoice-lines">${head}<tbody>${rows.join('')}</tbody></table></div>${last?`<div class="page-total">${totals}</div>`:''}<div class="page-foot">${payment}${note}<div class="page-number">Sida ${n+1} av ${chunks.length}</div></div></section>`;
 }).join('');
 const archivedPrint=!!root.closest('.archive-preview-content');
 const detail=attachment?(()=>{
   const groups=[];let group='',article='';
   for(const node of attachment.children){
     if(node.tagName==='H3'){
       if(node.nextElementSibling?.tagName==='TABLE')article=node.textContent;
       else group=node.textContent;
       continue;
     }
     if(node.tagName==='TABLE'){
       const rows=[...node.querySelectorAll('tbody tr')].map(tr=>({html:tr.outerHTML,weight:tr.textContent.length>125?2:1}));
       groups.push({group,article,head:node.querySelector('thead')?.outerHTML||'',rows});
       article='';
     }
   }
   const pages=[];let page=[],used=0;
   const flush=()=>{if(page.length){pages.push(page);page=[];used=0}};
   for(const g of groups){
     let offset=0;
     while(offset<g.rows.length){
       // Reserve space for a group title, column headings and the first entry.
       if(used>=14)flush();
       const room=17-used;
       const part=[];let consumed=1.5;
       while(offset<g.rows.length&&consumed+g.rows[offset].weight<=room){
         part.push(g.rows[offset].html);consumed+=g.rows[offset].weight;offset++;
       }
       if(!part.length){flush();continue}
       page.push({group:g.group,article:g.article,head:g.head,rows:part,continued:offset<g.rows.length});
       used+=consumed;
     }
   }
   flush();
   return pages.map((segments,index)=>{
     let previousGroup='';
     const html=segments.map(seg=>{
       const groupHeading=seg.group!==previousGroup?`<h3 class="detail-reference">${esc(seg.group)}</h3>`:'';
       previousGroup=seg.group;
       // A single article heading per group. Table column headings occur once for the article,
       // except when that same article continues on a new physical page.
       return `<div class="detail-group">${groupHeading}<h4 class="detail-article">${esc(seg.article)}</h4><table>${seg.head}<tbody>${seg.rows.join('')}</tbody></table></div>`;
     }).join('');
     return `<section class="paper appendix"><div class="page-head"><h2>${archivedPrint?'FAKTURAUNDERLAG – TESTKOPIA':'FAKTURAUNDERLAG – UTKAST'}</h2><p>${esc(attachment.querySelectorAll('p')[1]?.textContent||'')}</p></div><div class="appendix-body">${html}</div><div class="page-foot"><div class="page-number">Bilaga · Sida ${index+1} av ${pages.length}</div></div></section>`;
   }).join('');
 })():'';
 const styles=`
 @page{size:210mm 297mm;margin:0}
 *{box-sizing:border-box}
 html,body{margin:0;padding:0;background:#fff;color:#17243a;font-family:Arial,Helvetica,sans-serif}
 .paper{width:210mm;height:297mm;position:relative;overflow:hidden;padding:17mm 17mm 22mm;break-after:page;page-break-after:always;background:#fff}
 .paper:last-child{break-after:auto;page-break-after:auto}
 .page-head{height:auto;min-height:77mm;padding-bottom:4mm;display:flow-root}
 .invoice-top{display:flex;justify-content:space-between;gap:18mm;border-bottom:2px solid #17243a;padding-bottom:6mm}
 .invoice-top>div{width:50%;font-size:10pt;line-height:1.5}
 .invoice-top>div:last-child{text-align:right}
 .invoice-top h2{font-size:20pt;margin:0 0 3mm}
 .invoice-note{font-size:8pt;color:#5e697b}
 .invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:1mm 5mm;background:#f4f6fa;padding:3mm;margin-top:5mm;font-size:9pt}
 .invoice-meta div{display:flex;justify-content:space-between;gap:3mm}
 .invoice-meta strong{text-align:right}
 .invoice-comment{font-size:9pt;line-height:1.35;white-space:pre-line;max-height:10mm;overflow:hidden;margin:3mm 0 0;overflow-wrap:anywhere;display:block;clear:both}
 .invoice-comment:empty{height:2mm;margin:0}
 .continuation{border-bottom:2px solid #17243a;padding-bottom:5mm;display:flex;justify-content:space-between;font-size:12pt}
 .page-lines{height:109mm;overflow:hidden;clear:both}
 .invoice-lines{width:100%;border-collapse:collapse;font-size:9pt;table-layout:fixed}
 .invoice-lines th{font-size:8pt;text-align:left;background:#eef2f7;border-bottom:1px solid #9daab9;padding:3mm 1mm}
 .invoice-lines td{padding:3mm 1mm;border-bottom:1px solid #e7ebf0;vertical-align:top;overflow-wrap:anywhere}
 .invoice-lines th:first-child,.invoice-lines td:first-child{width:34%}
 .invoice-lines .num{text-align:right}
 .invoice-lines .refrow td{background:#f6f8fb;font-weight:bold;padding:4mm 1mm}
 .page-total{position:absolute;right:17mm;bottom:49mm;width:78mm;font-size:10pt}
 .page-total>p{font-size:9pt}
 .invoice-totals .row{display:flex;justify-content:space-between;padding:1.8mm 0}
 .invoice-totals .grand{font-size:13pt;font-weight:bold;border-top:2px solid #17243a;margin-top:2mm;padding-top:3mm}
 .page-foot{position:absolute;bottom:14mm;left:17mm;right:17mm;border-top:1px solid #9caabd;padding-top:3mm;font-size:8.5pt}
 .invoice-payment{display:flex;justify-content:space-between;gap:8mm}
 .invoice-payment>div{width:50%}
 .invoice-payment>div:last-child{text-align:right}
 .page-number{text-align:right;font-size:8pt;color:#647084;margin-top:2mm}
 .appendix .page-head{height:auto;min-height:0;padding-bottom:2mm;margin-bottom:1mm}.appendix .page-head h2{font-size:16pt;margin:0 0 1mm}.appendix .page-head p{margin:0;font-size:9pt}
 .appendix-body{font-size:8pt}
 .appendix-body .detail-group{margin-bottom:3mm;break-inside:avoid}
 .appendix-body h3{font-size:9pt;margin:2mm 0 1mm}
 .appendix-body h4{font-size:9pt;margin:1mm 0 1mm}
 .appendix-body table{width:100%;border-collapse:collapse}
 .appendix-body th,.appendix-body td{padding:2mm;border-bottom:1px solid #ddd;text-align:left}
 .appendix-body .num{text-align:right}.invoice-entry-comment{color:#5c6676;font-size:8pt;white-space:pre-wrap;margin-top:1mm;overflow-wrap:anywhere}
 @media screen{body{background:#e9edf2}.paper{margin:10mm auto;box-shadow:0 2mm 7mm #0002}}
 @media print{html,body{width:210mm;background:white!important}.paper{margin:0!important;box-shadow:none!important}}
 `;
 const archiveNumber=root.querySelector('.invoice-meta strong')?.textContent?.trim()||'Utkast';
 const archived=!!root.closest('.archive-preview-content');
 const title=archived?'Testfaktura '+archiveNumber:'Fakturautkast';
 const doc=printWindow.document;doc.open();doc.write(`<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)} – A4</title><style>${styles}
 .print-toolbar{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:12px;justify-content:center;z-index:9;border-bottom:1px solid #ddd;font:14px Arial}

 </style></head><body><div class="print-toolbar"><button onclick="window.print()">Skriv ut / Spara som PDF</button><span>A4 · ${esc(archiveNumber)} · TESTKOPIA</span></div>${pages}${detail}</body></html>`);doc.close();
 printWindow.focus();
}
